defaults:
  - /schema/metric: latency
  - _self_

name: latency
unit: ns/call

sample:
  size: 8192
  timeout_s: 60.0

should_discount_chain_cost: true
chain_length: 8192
warmup_runs: 10

throttle:
  min_clock_ratio: 0.75
  initial_delay_s: 0.05
