name: expf

signature:
  return_type: float
  arguments:
    - name: x
      type: float
      role: input

wrapper: null

domains:
  central:
    x:
      distribution: uniform
      low: -10.0
      high: 10.0
  wide:
    x:
      distribution: uniform
      low: -80.0
      high: 80.0
