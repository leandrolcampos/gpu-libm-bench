defaults:
  - /schema/input_generator@domains.central.generator: random
  - /schema/input_generator@domains.wide.generator: random
  - _self_

name: expf

signature:
  return_type: float
  arguments:
    - name: x
      type: float
      role: input

wrapper: null

domains:
  central:
    generator:
      name: random
      arguments:
        x:
          distribution: uniform
          low: -10.0
          high: 10.0
  wide:
    generator:
      name: random
      arguments:
        x:
          distribution: uniform
          low: -80.0
          high: 80.0
