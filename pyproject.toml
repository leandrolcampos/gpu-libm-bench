[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gpu-libm-bench"
version = "0.1.0"
description = "GPU math library benchmarking"
readme = "README.md"
authors = [{ name = "Leandro A. Lacerda Campos" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.4.0rc2,<1.5",
    "numpy>=2.0,<3",
    "omegaconf>=2.4.1rc1,<2.5",
    "rich>=14,<15",
]

[project.optional-dependencies]
native = ["pybind11>=3,<4"]

[project.scripts]
gpu-libm-bench = "gpu_libm_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_libm_bench"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.environments]
default = { solve-group = "default" }
native = { features = ["native"], solve-group = "default" }

[tool.pixi.dependencies]
python = "3.12.*"
mypy = ">=1.14,<2"
pytest = ">=8,<10"
ruff = ">=0.9,<1"

[tool.pixi.pypi-dependencies]
gpu-libm-bench = { path = ".", editable = true }

[tool.pixi.tasks]
check = { depends-on = ["test", "lint", "format-check", "typecheck"] }
format = "ruff format ."
format-check = "ruff format --check ."
lint = "ruff check ."
test = "pytest"
typecheck = "mypy"

[tool.pixi.feature.native.dependencies]
clang = ">=19"
clang-format = ">=19"
clang-tools = ">=19"
cmake = ">=3.31,<5"
ninja = ">=1.12,<2"

[tool.pixi.feature.native.pypi-dependencies]
gpu-libm-bench = { path = ".", editable = true, extras = ["native"] }

[tool.pixi.feature.native.tasks]
common-build = { cmd = "cmake --build build/backends/common", depends-on = ["common-configure"] }
common-configure = "cmake -S backends/common/tests -B build/backends/common -G Ninja -DCMAKE_BUILD_TYPE=Release"
common-test = { cmd = "ctest --test-dir build/backends/common --output-on-failure", depends-on = ["common-build"] }
cuda-build = { cmd = "cmake --build build/backends/cuda", depends-on = ["cuda-configure"] }
cuda-configure = "cmake -S backends/cuda -B build/backends/cuda -G Ninja -DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE=$CONDA_PREFIX/bin/python"
cuda-test = { cmd = "pytest -m cuda", depends-on = ["cuda-build"] }
cuda-tidy = { cmd = "run-clang-tidy -quiet -p build/backends/cuda", depends-on = ["cuda-configure"] }
images-test = { cmd = "pytest -m images", depends-on = ["kernels-build"] }
kernels-build = { cmd = "cmake --build build/kernels", depends-on = ["kernels-configure"] }
kernels-configure = "python tools/configure_kernels.py"
kernels-tidy = { cmd = "run-clang-tidy -quiet -p build/kernels", depends-on = ["kernels-configure"] }
list-devices = { cmd = "python tools/list_devices.py", depends-on = ["cuda-build"] }
native-format-check = "find backends kernels -regextype posix-extended -type f -regex '.*\\.(c|cc|cpp|cxx|h|hh|hpp|hxx|cu|cuh|hip|inc)' -exec clang-format --dry-run --Werror '{}' +"

[tool.mypy]
check_untyped_defs = true
files = ["src/gpu_libm_bench"]
python_version = "3.12"
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "-m 'not cuda and not images'"
filterwarnings = ["error"]
markers = [
    "cuda: integration tests requiring the built CUDA backend and NVIDIA driver",
    "images: integration tests requiring compiled device images and their compiler tools",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]
