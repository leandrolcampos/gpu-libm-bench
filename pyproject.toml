[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gpu-libm-bench"
version = "0.1.0"
description = "A benchmarking framework for GPU math libraries"
authors = [{ name = "Leandro A. Lacerda Campos" }]
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.0,<3",
    "hydra-core>=1.4.0rc2,<1.5",
    "omegaconf>=2.4.1rc1,<2.5",
    "rich>=14,<15",
]

[project.scripts]
gpu-libm-bench = "gpu_libm_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_libm_bench"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
pytest = ">=8,<10"
ruff = ">=0.9,<1"
mypy = ">=1.14,<2"

[tool.pixi.pypi-dependencies]
gpu-libm-bench = { path = ".", editable = true }

[tool.pixi.tasks]
test = "pytest"
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
typecheck = "mypy"
check = { depends-on = ["test", "lint", "format-check", "typecheck"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src/gpu_libm_bench"]
check_untyped_defs = true
warn_unused_ignores = true
